<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <title>Rentas</title>
</head>
<body class="p-8">

  <script src="../js/lib/roles_config.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/navbar.js"></script>

  <div class="flex justify-between items-center mb-4 mt-4">
    <a href="insertar.html" class="btn btn-primary">
         Registrar
  </a>
      <input
        type="text"
        id="buscador"
        placeholder="Buscar por cliente, vehículo, sucursal..."
        class="input input-bordered w-80">

  <div class="flex items-center gap-2">
        <span class="font-semibold text-sm">ORDENAR POR:</span>
      <select id="ordenarPor" class="select select-bordered select-sm">
        <option value="id_renta">ID Renta</option>
        <option value="cliente">Cliente Alfabético A-Z / Z-A</option>
        <option value="sucursal_destino">Sucursal Destino</option>
      </select>
      <select id="direccionOrden" class="select select-bordered select-sm">
        <option value="asc">Ascendente A-Z 1-9</option>
        <option value="desc">Descendente Z-A 9-1</option>
      </select>
    </div>
  </div>
        <div class="overflow-x-auto">
          <table class="table table-zebra w-full">
            <thead>
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Vehículo</th>
                <th>Seguro</th>
                <th>Sucursal Origen</th>
                <th>Sucursal Destino</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
                <th>Depósito</th>
                <th>Estado Depósito</th>
                <th>Precio</th>
                <th>Estado renta</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>

<div class="flex justify-end items-center gap-2 mt-4">
    <div class="pagination flex items-center gap-2"></div>
</div>

  <script type="module" src="../js/renta.js"></script>
</body>
</html>
