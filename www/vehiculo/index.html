<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Vehículos</title>
</head>
<body class="p-8">

    <script src="../js/lib/roles_config.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/navbar.js"></script>

    <div id="tableList">
        
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 mt-4 bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm">
            <div class="flex flex-wrap items-center gap-3">
                <button id="addBtn" class="btn btn-primary">+ Agregar Vehículo</button>

               
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Buscar marca, modelo, placa, sucursal..." class="input input-bordered input-sm w-64 md:w-80 pl-9 bg-white" />
                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Ordenar por:</span>
                    <select id="orderBySelect" class="select select-bordered select-sm bg-white">
                        <option value="v.id_vehiculo">ID Vehículo</option>
                        <option value="m.nombre_modelo">Modelo / Marca (A-Z / Z-A)</option>
                        <option value="m.costo_diario">Precio Renta ($)</option>
                        <option value="estado_prioridad">Prioridad por Estado</option>
                    </select>
                </div>

                
                <div class="flex items-center gap-2" id="dirContainer">
                    <select id="orderDirSelect" class="select select-bordered select-sm bg-white">
                        <option value="ASC">Ascendente (Menor a Mayor / A-Z)</option>
                        <option value="DESC">Descendente (Mayor a Menor / Z-A)</option>
                    </select>
                </div>

              
                <div class="flex items-center gap-2 hidden" id="estadoGroupContainer">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Prioridad:</span>
                    <select id="estadoPrioritySelect" class="select select-bordered select-sm bg-white">
                        <option value="DISPONIBLE_PRIMERO">Primero Disponibles</option>
                        <option value="RENTADO_PRIMERO">Primero Rentados</option>
                        <option value="MANTENIMIENTO_PRIMERO">Primero en Mantenimiento</option>
                    </select>
                </div>
            </div>
        </div>

       
        <div class="overflow-x-auto bg-white rounded-lg border border-gray-200">
            <table class="table table-zebra w-full" id="tablaVehiculos">
                <thead>
                    <tr class="bg-gray-100">
                        <th>ID</th>
                        <th>Vehículo / Modelo</th>
                        <th>Placas</th>
                        <th>Categoría</th>
                        <th>Transmisión</th>
                        <th>Precio Renta</th>
                        <th>Estado</th>
                        <th>Ubicación</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-6 pt-4 border-t border-gray-200">
            <span id="pageInfo" class="text-sm text-gray-600 font-medium">Cargando registros...</span>
            <div class="join" id="paginationControls"></div>
        </div>
    </div>

    <div id="formContainer" class="hidden max-w-md bg-white p-6 shadow-xl rounded-2xl border border-gray-100"></div>

    <script type="module" src="../js/vehiculo.js"></script>
</body>
</html>
