<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<title>Dashboard</title>
</head>
<body class="p-8 bg-gray-50">

<script src="../js/lib/roles_config.js"></script>
<script src="../js/session.js"></script>
<div id="navbar-container"></div>
<script src="../js/navbar.js"></script>

<div class="max-w-[1500px] mx-auto mt-8">


    <!-- Gráficas -->
    <!-- KPIs de ventas -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
    <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
        <h2 class="text-sm font-medium text-gray-500">Ventas este mes</h2>
        <p id="kpiVentasEsteMes" class="text-3xl font-bold text-gray-800 mt-1">$0.00</p>
    </div>
    <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
        <h2 class="text-sm font-medium text-gray-500">Ventas mes pasado</h2>
        <p id="kpiVentasMesPasado" class="text-3xl font-bold text-gray-800 mt-1">$0.00</p>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
        <h2 class="font-semibold text-gray-700 mb-2">Ventas por día (últimos 30 días)</h2>
        <div id="chartVentasPorDia"></div>
    </div>

    <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
        <div class="flex items-center justify-between mb-2">
            <h2 class="font-semibold text-gray-700">Fallas reportadas por mes</h2>
            <div class="flex items-center gap-2">
                <input type="month" id="mesFallas" class="input input-bordered input-sm">
                <span class="text-sm text-gray-500">
                    Total: <span id="kpiFallasMes" class="font-semibold text-gray-800">0</span>
                </span>
            </div>
        </div>
        <div id="chartFallasPorMes"></div>
    </div>

    <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
        <h2 class="font-semibold text-gray-700 mb-2">Modelos de vehículo por categoría</h2>
        <div id="chartModelosCategoria"></div>
    </div>

    <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
        <h2 class="font-semibold text-gray-700 mb-2">Mecánicos con más reportes</h2>
        <div id="chartTopMecanicos"></div>
    </div>

</div>
</div>

<script type="module" src="../js/dashboard.js?v=2"></script>
</body>
</html>
