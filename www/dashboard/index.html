<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<title>Dashboard</title>
</head>
<body class="p-8 bg-gray-50">

<script src="../js/session.js"></script>
<div id="navbar-container"></div>
<script src="../js/navbar.js"></script>

<div class="max-w-[1500px] mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Dashboard</h1>

    <!-- Gráficas -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
            <h2 class="font-semibold text-gray-700 mb-2">Fallas reportadas por mes</h2>
            <div id="chartFallasPorMes"></div>
        </div>

        <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
            <h2 class="font-semibold text-gray-700 mb-2">Modelos de vehículo por categoría</h2>
            <div id="chartModelosCategoria"></div>
        </div>

        <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
            <h2 class="font-semibold text-gray-700 mb-2">Mecánicos con más reportes</h2>
            <div id="chartTopMecanicos"></div>
        </div>

        <div class="bg-white rounded-2xl shadow p-5 border border-gray-100">
            <h2 class="font-semibold text-gray-700 mb-2">Imágenes de modelo: principal vs galería</h2>
            <div id="chartImagenesTipo"></div>
        </div>

        <div class="bg-white rounded-2xl shadow p-5 border border-gray-100 lg:col-span-2">
            <h2 class="font-semibold text-gray-700 mb-2">Fallas con evidencia fotográfica</h2>
            <div id="chartFallasEvidencia"></div>
        </div>
    </div>
</div>

<script type="module" src="../js/dashboard.js?v=2"></script>
</body>
</html>
