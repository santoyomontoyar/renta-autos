<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Clientes</title>
</head>
<body class="p-8">

    <script src="../js/session.js"></script>
    <script src="../js/navbar.js"></script>

    <div id="tableList">
        <!-- CONTROLES DE ORDENAMIENTO -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 mt-4 bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm">
            <button id="addBtn" class="btn btn-primary">+ Agregar Cliente</button>

            <div class="flex flex-wrap items-center gap-3">
                <!-- Criterio Principal de Ordenamiento -->
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Ordenar por:</span>
                    <select id="orderBySelect" class="select select-bordered select-sm bg-white">
                        <option value="c.id_cliente">ID Cliente</option>
                        <option value="u.nombre">Nombre (Alfabético A-Z / Z-A)</option>
                        <option value="estado_prioridad">Prioridad por Estado</option>
                    </select>
                </div>

                <!-- Modificador de Dirección o Prioridad -->
                <div class="flex items-center gap-2" id="dirContainer">
                    <select id="orderDirSelect" class="select select-bordered select-sm bg-white">
                        <option value="ASC">Ascendente (1-9 / A-Z)</option>
                        <option value="DESC">Descendente (9-1 / Z-A)</option>
                    </select>
                </div>

                <!-- Selector Específico para Prioridad de Estado (Oculto por defecto, se activa solo si se selecciona Estado) -->
                <div class="flex items-center gap-2 hidden" id="estadoGroupContainer">
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Prioridad:</span>
                    <select id="estadoPrioritySelect" class="select select-bordered select-sm bg-white">
                        <option value="ACTIVO_PRIMERO">Primero Activos</option>
                        <option value="INACTIVO_PRIMERO">Primero Inactivos</option>
                        <option value="SUSPENDIDO_PRIMERO">Primero Suspendidos</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="overflow-x-auto bg-white rounded-lg border border-gray-200">
            <table class="table table-zebra w-full" id="tablaClientes">
                <thead>
                    <tr class="bg-gray-100">
                        <th>ID Cliente</th>
                        <th>Nombre Completo</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <!-- PAGINADOR ABAJO DE TODO -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-6 pt-4 border-t border-gray-200">
            <span id="pageInfo" class="text-sm text-gray-600 font-medium">Cargando registros...</span>
            <div class="join" id="paginationControls"></div>
        </div>
    </div>

    <div id="formContainer" class="hidden max-w-md"></div>

    <script type="module" src="../js/cliente.js"></script>
</body>
</html>
